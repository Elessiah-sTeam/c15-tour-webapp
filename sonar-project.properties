sonar.projectKey=Elessiah-sTeam_c15-tour-webapp
sonar.organization=elessiah-steam
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Tests : excluder les fichiers .test.* du coverage (ils sont la source des tests, pas du code applicatif a couvrir)
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.coverage.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**,src/main.tsx,src/**/*.d.ts


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=c15-tour-webapp
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
