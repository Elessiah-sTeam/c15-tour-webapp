name: Webapp CI

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: dependences
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Tests unitaires
        run: npm run test

      - name: Build
        run: npm run build
